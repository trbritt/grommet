[package]
name = "grommet-offload"
description = "Pinned Rayon offload pool for grommet shards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
exclude.workspace = true
documentation = "https://docs.rs/grommet-offload"
keywords = ["rayon", "offload", "thread-pool", "numa", "thread-per-core"]
categories = ["concurrency", "asynchronous", "hardware-support"]

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(coverage)"] }

[dependencies]
rayon = "1"
# The permit bound and the result channel. Both used to be tokio's, which put a
# runtime in the graph of a crate that only runs Rayon tasks; neither needs one.
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
grommet = { workspace = true }

[features]
default = ["driver-tokio", "topology", "vendored"]

# Host the shard on a tokio runtime. See `grommet` for why this is permanent.
driver-tokio = ["grommet/driver-tokio"]

# Hardware placement, through `grommet`. See that crate for the trade.
topology = ["grommet/topology"]

# Build libhwloc from source. See `grommet-topology` for why that is the
# default and what it costs.
vendored = ["topology", "grommet/vendored"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }

# The vendored libhwloc build needs network access, which docs.rs does not
# have, so defaults are off. Both features are then named explicitly: without
# `driver-tokio` a shard has no host to wait on and the crate refuses to
# compile, and without `topology` the documentation would describe the
# pure-Rust fallback rather than the crate.
[package.metadata.docs.rs]
no-default-features = true
features = ["driver-tokio", "topology"]
