[package]
name = "grommet-core"
description = "Key-affine fair scheduling as a pure, runtime-free data structure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
exclude.workspace = true
documentation = "https://docs.rs/grommet-core"
keywords = ["scheduler", "fairness", "round-robin", "queue", "sharding"]
categories = ["data-structures", "concurrency", "algorithms"]

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(coverage)", "cfg(loom)"] }

[dependencies]
ahash = "0.8"
# `CachePadded`: the ring's tail is written by every producer and must not share
# a line with the slots the consumer is reading.
crossbeam-utils = "0.8"
grommet-macros = { workspace = true }

# Loom builds compile the crate itself with modeled atomics and a checked
# `UnsafeCell`, so the dependency cannot be dev-only; gating it behind
# `--cfg loom` keeps it out of every ordinary build. Same arrangement as
# `grommet`, and the one tokio itself uses.
[target.'cfg(loom)'.dependencies]
loom = "0.7"
