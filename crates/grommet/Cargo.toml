[package]
name = "grommet"
description = "Thread-per-core, key-affine work scheduling with hardware-aware placement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
exclude.workspace = true
documentation = "https://docs.rs/grommet"
keywords = ["thread-per-core", "scheduler", "async", "sharding", "runtime"]
categories = ["asynchronous", "concurrency", "network-programming"]

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(coverage)", "cfg(loom)"] }

[dependencies]
# `CachePadded`: the outstanding set's ready words are written by other
# threads and read by the owner, so they must not share a cache line.
ahash = "0.8"
crossbeam-utils = "0.8"
futures = "0.3"
# Latency histograms. `default-features = false` drops serialization and the
# cross-thread recorder, neither of which this uses: the shard records into a
# histogram it owns and publishes it once per tick. Constructed with explicit
# bounds, which turns auto-resizing off and makes recording allocation-free.
# That is the property the hot path depends on, and `metrics` asserts it.
hdrhistogram = { version = "7", default-features = false }
# The wait list's lock. Never taken on a drain that has no waiters, so this is
# a backpressure-path primitive rather than a hot-path one. Where a lock is
# taken at all it should be this one: no poisoning to unwrap through, one byte
# of state, and no allocation on contention.
parking_lot = "0.12"
# The production clock. Reading time is on the reactor's hot path several times
# per turn, and `Instant::now` costs about as much as two scheduler operations;
# quanta reads the CPU's counter instead where the platform has a usable one,
# and falls back to the OS clock where it does not.
quanta = "0.12"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
grommet-core = { workspace = true }
# `default-features = false` so both switches below, whether to use hwloc at
# all and vendored versus system, are re-exported here rather than fixed. A
# Cargo feature cannot turn off a dependency's default, so a crate that wants
# either choice has to be able to reach it from the top of the graph.
grommet-topology = { workspace = true, default-features = false }

[features]
default = ["driver-tokio", "topology", "vendored"]

# Read the machine and bind threads to it, through libhwloc.
#
# On by default, because hardware-aware placement is what this runtime is for
# and a default that cannot pin a thread would misrepresent it. Turning it off
# with `default-features = false` gives a pure-Rust build in seconds: no C
# toolchain, no build-time network fetch, and musl and air-gapped builds work,
# at the cost of real placement: layout is planned from `available_parallelism`
# alone and no thread is bound. `PinPolicy::Require` does not exist in that
# build, so asking for placement you cannot get is a compile error rather than
# a silently unpinned process.
topology = ["grommet-topology/hwloc"]

# Host the shard on a tokio current-thread runtime and wait as its guest.
#
# On by default and meant to stay available permanently: the ecosystem's
# database, cache and HTTP clients are written against tokio's IO, and a
# processor awaiting one of them needs that runtime to be the thing driving this
# thread. Grommet's own drivers arrive alongside it rather than in place of it,
# so a deployment picks per binary rather than per fork.
driver-tokio = []

# Build libhwloc from source. See `grommet-topology` for why that is the
# default and what it costs.
vendored = ["topology", "grommet-topology/vendored"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "test-util"] }

# Loom builds compile the crate itself with modeled atomics, so the dependency
# cannot be dev-only; gating it behind `--cfg loom` keeps it out of every
# ordinary build. This is the arrangement tokio itself uses.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

# The vendored libhwloc build needs network access, which docs.rs does not
# have, so defaults are off. Both features are then named explicitly: without
# `driver-tokio` a shard has no host to wait on and the crate refuses to
# compile, and without `topology` the documentation would describe the
# pure-Rust fallback rather than the crate. `topology` is named explicitly so the
# documentation still describes the default configuration rather than the
# pure-Rust opt-out.
[package.metadata.docs.rs]
no-default-features = true
features = ["driver-tokio", "topology"]
